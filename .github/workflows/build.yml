name: Build, Test, and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Build WASM JVM
        run: make all

      - name: Build Minecraft Blob (pre-extract JAR)
        run: node scripts/build-blob.js

      - name: Verify outputs
        run: |
          ls -lh public/jvm.js public/jvm.wasm public/minecraft.blob 2>/dev/null || true
          echo "Blob size:"
          wc -c public/minecraft.blob 2>/dev/null || echo "no blob"

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ./public

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./public

      - name: List files
        run: find ./public -type f | head -20

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run smoke test (Node.js WASM)
        id: test
        timeout-minutes: 2
        run: node test/smoke-test.js

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
