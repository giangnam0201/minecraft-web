name: Build Minecraft 1.16.5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deobfuscation deps
        run: cd port-1.16/scripts && npm install adm-zip

      - name: Compile java.net stubs (release 8 bypass modules)
        run: |
          mkdir -p port-1.16/libs/prebuilt
          javac --release 8 -d port-1.16/libs/prebuilt port-1.16/src/stubs/java/java/net/Proxy.java port-1.16/src/stubs/java/java/net/Authenticator.java

      - name: Deobfuscate 1.16.5 JAR
        run: node port-1.16/scripts/deobfuscate.js
        timeout-minutes: 10

      - name: Verify deobfuscated JAR
        run: |
          ls -lh port-1.16/libs/minecraft-1.16.5-deobf.jar
          echo "java/net/Proxy occurrences in JAR (should be 0):"
          grep -ac "java/net/Proxy" port-1.16/libs/minecraft-1.16.5-deobf.jar || echo "0 (GOOD)"
          echo "org/eaglercraft/network/Proxy occurrences (should be >0 if replacement worked):"
          grep -ac "org/eaglercraft/network/Proxy" port-1.16/libs/minecraft-1.16.5-deobf.jar || echo "0 (BAD - replacement failing)"

      - name: Make Gradle wrapper executable
        run: chmod +x port-1.16/gradlew

      - name: Build with TeaVM (WASM)
        working-directory: port-1.16
        run: |
          set +e
          ./gradlew target_teavm_wasm_gc:generateWasmGC --no-daemon --stacktrace > /tmp/gradle.log 2>&1
          RC=$?
          cat /tmp/gradle.log
          exit $RC
        timeout-minutes: 30

      - name: Copy WASM output
        run: |
          mkdir -p public
          cp port-1.16/target_teavm_wasm_gc/build/wasm/classes.wasm public/ 2>/dev/null || echo "No classes.wasm"
          ls -lh public/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
