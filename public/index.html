<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Web - WASM JVM</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
    background:#1a1a2e;color:#e0e0e0;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    overflow:hidden;height:100vh;width:100vw;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    user-select:none;
}
#container{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
#game-canvas{display:block;image-rendering:pixelated;border:2px solid #333;background:#000;max-width:100vw;max-height:100vh}
#loader{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    text-align:center;z-index:10;background:rgba(0,0,0,0.9);
    padding:32px 48px;border-radius:12px;border:1px solid #444;
}
#loader h1{font-size:28px;margin-bottom:8px;color:#7ec850}
#loader p{margin-bottom:4px;font-size:13px;color:#999}
#loader .spinner{
    border:3px solid #333;border-top:3px solid #7ec850;border-radius:50%;
    width:40px;height:40px;animation:spin .8s linear infinite;margin:16px auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
#status{color:#7ec850}#status-percent{color:#aaa;font-size:12px}
#file-input{display:none}
#manual-load{display:none;margin-top:12px}
#manual-load button{
    background:#7ec850;color:#000;border:none;padding:8px 20px;
    border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold
}
#manual-load button:hover{background:#6ab040}
</style>
</head>
<body>
<div id="container">
    <canvas id="game-canvas" width="854" height="480"></canvas>
    <div id="loader">
        <h1>Minecraft Web</h1>
        <p>WASM JVM - 1.16.5 Client</p>
        <div class="spinner"></div>
        <p id="status">Loading WASM JVM...</p>
        <p id="status-percent"></p>
        <div id="manual-load">
            <p style="margin-bottom:8px;color:#c44">Auto-download failed</p>
            <input type="file" id="file-input" accept=".jar">
            <button onclick="document.getElementById('file-input').click()">Choose JAR manually</button>
        </div>
    </div>
</div>
<script src="jvm.js"></script>
<script type="module" src="js/main.js"></script>
<script>
(function(){
    const fi=document.getElementById('file-input');
    fi.addEventListener('change',async(e)=>{
        const f=e.target.files[0];
        if(f){
            const buf=await f.arrayBuffer();
            const data=new Uint8Array(buf);
            const ptr=Module._malloc(data.length);
            Module.HEAPU8.set(data,ptr);
            const jvm_load_class=Module.cwrap('jvm_load_class','number',['number','number']);
            jvm_load_class(ptr,data.length);
            Module._free(ptr);
            document.getElementById('loader').style.display='none';
            if(window.startGameLoop)window.startGameLoop();
        }
    });
})();
</script>
</body>
</html>
